name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Regenerate Android Platform
        run: |
          flutter create \
            --platforms=android \
            --project-name=newasa_food_hub \
            .

      - name: Configure Google Services Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services' version '4.5.0' apply false",
                  1
              )
              settings.write_text(text)

          app = Path("android/app/build.gradle")
          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )
              app.write_text(text)
          PY

          echo "Google Services configuration:"
          grep -R "google-services" android/settings.gradle android/app/build.gradle || true

      - name: Set Android minSdk to 23
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle

      - name: Check Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android

          keytool -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get SHA fingerprints
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify Firebase resources
        run: |
          echo "Checking generated Firebase resources..."
          find android/app/build/generated -type f 2>/dev/null | grep -E "values.xml|global_tracker.xml" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newasa-food-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
