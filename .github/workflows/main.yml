name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create fresh Android project
        run: |
          mkdir build_project
          cd build_project
          flutter create -t app .
          rm -rf lib
          cp -r ../lib .
          cp ../pubspec.yaml .
          
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          
          flutter pub get

      - name: Build APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newasa-food-hub-apk
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
