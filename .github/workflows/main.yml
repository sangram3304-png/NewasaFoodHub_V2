name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create fresh Flutter project
        run: |
          flutter create build_project

      - name: Add Firebase configuration
        run: |
          cp android/app/google-services.json build_project/android/app/google-services.json

      - name: Set Android minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_project/android/app/build.gradle")
          text = p.read_text()

          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 23"
          )

          text = text.replace(
              "minSdkVersion = flutter.minSdkVersion",
              "minSdkVersion = 23"
          )

          p.write_text(text)
          PY

          grep -n "minSdk" build_project/android/app/build.gradle

      - name: Replace Android project
        run: |
          rm -rf android
          cp -r build_project/android android

      - name: Prepare app code
        run: |
          mkdir -p lib

          if [ -f lib/main.dart ]; then
            echo "Using existing lib/main.dart"
          else
            cp build_project/lib/main.dart lib/main.dart
          fi

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Verify final Android minSdk
        run: |
          grep -n "minSdk" android/app/build.gradle

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewasaFoodHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
