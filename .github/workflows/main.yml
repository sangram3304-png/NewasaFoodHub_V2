name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Flutter setup
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 3. Check Flutter project
      - name: Check Flutter Project
        run: |
          echo "Flutter version:"
          flutter --version
          echo "Project name:"
          grep "^name:" pubspec.yaml

      # 4. Regenerate Android platform
      - name: Regenerate Android Platform
        run: |
          flutter create \
            --platforms=android \
            --project-name=newasa_food_hub \
            .

      # 5. Set Android minSdk to 23
      - name: Set Android minSdk to 23
        run: |
          echo "Before change:"
          grep -R "minSdk" android/app || true

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle

          echo "After change:"
          grep -R "minSdk" android/app || true

      # 6. Check Firebase configuration
      - name: Check Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration found."

      # 7. Flutter dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 8. Create Debug Keystore
      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.config/.android

          keytool -genkeypair \
            -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 9. Get SHA-1 and SHA-256
      - name: Get SHA-1 and SHA-256
        run: |
          echo "========== SHA-1 & SHA-256 =========="

          keytool -list -v \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android

          echo "======================================"

      # 10. Build APK
      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newasa-food-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
