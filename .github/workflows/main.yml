name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Regenerate Android Platform
        run: |
          flutter create \
            --platforms=android \
            --project-name=newasa_food_hub \
            --org=com.newasafoodhub \
            .

      - name: Set Android Package Name
        run: |
          sed -i 's/applicationId = "com.newasafoodhub.newasa_food_hub"/applicationId = "com.newasafoodhub.app"/g' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.newasa_food_hub"/applicationId = "com.newasafoodhub.app"/g' android/app/build.gradle.kts

          echo "Application ID:"
          grep "applicationId" android/app/build.gradle.kts

      - name: Configure Google Services Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          settings_text = settings.read_text()
          app_text = app.read_text()

          if 'com.google.gms.google-services' not in settings_text:
              settings_text = settings_text.replace(
                  'plugins {',
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )
              settings.write_text(settings_text)

          if 'com.google.gms.google-services' not in app_text:
              app_text = app_text.replace(
                  'plugins {',
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )
              app.write_text(app_text)
          PY

      - name: Set Android minSdk to 23
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle.kts

          echo "minSdk:"
          grep "minSdk" android/app/build.gradle.kts || true

      - name: Check Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration found."

          echo "Checking Firebase package name:"
          python3 - <<'PY'
          import json

          with open("android/app/google-services.json") as f:
              data = json.load(f)

          clients = data.get("client", [])

          for client in clients:
              package_name = client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              print("Firebase package:", package_name)
          PY

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android

          keytool -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get SHA fingerprints
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newasa-food-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
