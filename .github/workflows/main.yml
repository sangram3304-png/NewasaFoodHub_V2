name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create fresh Flutter project
        run: |
          flutter create build_project

          # Firebase configuration
          cp android/app/google-services.json build_project/android/app/google-services.json

          # Firebase Auth requires Android API 23+
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' build_project/android/app/build.gradle.kts

          # Use the fresh Android project
          rm -rf android
          cp -r build_project/android android

      - name: Copy app code
        run: |
          if [ -f lib/main.dart ]; then
            echo "Using existing lib/main.dart"
          else
            mkdir -p lib
            cp build_project/lib/main.dart lib/main.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewasaFoodHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
