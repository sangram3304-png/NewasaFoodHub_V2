name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.newasafoodhub --project-name newasafoodhub_v2 .

      - name: Set Firebase package name
        run: |
          sed -i 's/com.newasafoodhub.newasa_food_hub/com.newasafoodhub.app/g' android/app/build.gradle.kts
          sed -i 's/com.example.newasafoodhub_v2/com.newasafoodhub.app/g' android/app/build.gradle.kts
          sed -i 's/com.newasafoodhub.newasa_food_hub/com.newasafoodhub.app/g' android/app/src/main/AndroidManifest.xml

      - name: Verify configuration
        run: |
          echo "=== Firebase package ==="
          grep -n "package_name" android/app/google-services.json
          echo "=== Application ID ==="
          grep -n "applicationId" android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewasaFoodHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
