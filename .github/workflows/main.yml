name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 3. Regenerate Android platform
      - name: Regenerate Android Platform
        run: |
          flutter create --platforms=android .

      # 4. Restore Firebase configuration
      - name: Check Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found"
            exit 1
          fi
          echo "Firebase configuration found."

      # 5. Flutter dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 6. Create Android Debug Keystore
      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.config/.android

          keytool -genkeypair \
            -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 7. Get SHA-1 and SHA-256
      - name: Get SHA-1 and SHA-256
        run: |
          echo "========== SHA-1 & SHA-256 =========="

          keytool -list -v \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android

          echo "======================================"

      # 8. Build Release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newasa-food-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
