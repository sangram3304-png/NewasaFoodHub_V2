name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Flutter project structure
        run: |
          flutter create --project-name newasa_food_hub temp_app
          cp -r temp_app/android .
          cp -r temp_app/ios .
          cp -r temp_app/web .
          cp -r temp_app/test .
          cp temp_app/analysis_options.yaml .
          rm -rf temp_app

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newasa-food-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
