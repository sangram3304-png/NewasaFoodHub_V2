name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 3. Check project
      - name: Check Flutter Project
        run: |
          echo "Flutter version:"
          flutter --version
          echo "Project name:"
          grep "^name:" pubspec.yaml

      # 4. Regenerate Android platform
      - name: Regenerate Android Platform
        run: |
          flutter create \
            --platforms=android \
            --project-name=newasa_food_hub \
            .

      # 5. Force Android minSdk to 23
      - name: Set Android minSdk to 23
        run: |
          echo "Before change:"
          grep -R "minSdk" android/app || true

          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
            from pathlib import Path

            p = Path("android/app/build.gradle.kts")
            text = p.read_text()

            text = text.replace(
                "minSdk = flutter.minSdkVersion",
                "minSdk = 23"
            )

            text = text.replace(
                "minSdk = flutter.minSdkVersion",
                "minSdk = 23"
            )

            p.write_text(text)
            PY
          fi

          if [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
            from pathlib import Path

            p = Path("android/app/build.gradle")
            text = p.read_text()

            text = text.replace(
                "minSdkVersion flutter.minSdkVersion",
                "minSdkVersion 23"
            )

            text = text.replace(
                "minSdk flutter.minSdkVersion",
                "minSdk 23"
            )

            p.write_text(text)
            PY
          fi

          echo "After change:"
          grep -R "minSdk" android/app || true

      # 6. Verify Android Manifest
      - name: Verify Android Project
        run: |
          echo "Android Manifest:"
          cat android/app/src/main/AndroidManifest.xml

          echo "Android build files:"
          ls -la android/app/

      # 7. Check Firebase configuration
      - name: Check Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

          echo "Firebase configuration found."

      # 8. Flutter dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 9. Create Debug Keystore
      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.config/.android

          keytool -genkeypair \
            -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 10. Get SHA-1 and SHA-256
      - name: Get SHA-1 and SHA-256
        run: |
          echo "========== SHA-1 & SHA-256 =========="

          keytool -list -v \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android

          echo "======================================"

      # 11. Build Release APK
      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newasa-food-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
