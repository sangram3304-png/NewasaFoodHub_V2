name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create fresh Flutter project
        run: |
          flutter create build_project

      - name: Add Firebase configuration
        run: |
          mkdir -p build_project/android/app

          if [ -f google-services.json ]; then
            cp google-services.json build_project/android/app/google-services.json
          elif [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json build_project/android/app/google-services.json
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi

      - name: Configure Firebase Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_project/android/app/build.gradle")
          text = p.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'"
              )

          p.write_text(text)

          root = Path("build_project/android/build.gradle")
          text = root.read_text()

          if "com.google.gms:google-services" not in text:
              text = text.replace(
                  "buildscript {",
                  "buildscript {\n    dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'\n    }"
              )

          root.write_text(text)
          PY

      - name: Force Android minSdk to 23
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("build_project/android/app/build.gradle")
          text = p.read_text()

          text = re.sub(
              r'(?m)^\s*minSdkVersion\s+.*$',
              '        minSdkVersion 23',
              text
          )

          text = re.sub(
              r'(?m)^\s*minSdk\s*=\s*.*$',
              '        minSdk = 23',
              text
          )

          p.write_text(text)
          PY

      - name: Replace Android project
        run: |
          rm -rf android
          cp -r build_project/android android

      - name: Prepare app code
        run: |
          mkdir -p lib

          if [ -f lib/main.dart ]; then
            echo "Using existing lib/main.dart"
          else
            cp build_project/lib/main.dart lib/main.dart
          fi

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewasaFoodHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
