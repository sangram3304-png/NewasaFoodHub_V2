name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Check Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found"
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Create Flutter Android files
        run: |
          flutter create --platforms=android .

      - name: Restore Firebase configuration
        run: |
          echo "Checking Firebase configuration..."

          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json was removed."
            exit 1
          fi

          echo "Firebase configuration is ready."

      - name: Configure Firebase Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'"
              )

          p.write_text(text)

          root = Path("android/build.gradle")
          text = root.read_text()

          if "com.google.gms:google-services" not in text:
              if "buildscript {" in text:
                  text = text.replace(
                      "buildscript {",
                      """buildscript {
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }"""
                  )
              else:
                  text = """buildscript {
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }

          """ + text

          root.write_text(text)
          PY

      - name: Set Android minSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text = re.sub(
              r'(?m)^\s*minSdkVersion\s+.*$',
              '        minSdkVersion 23',
              text
          )

          text = re.sub(
              r'(?m)^\s*minSdk\s*=\s*.*$',
              '        minSdk = 23',
              text
          )

          p.write_text(text)
          PY

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewasaFoodHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
