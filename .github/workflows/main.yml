name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create fresh Flutter project
        run: |
          flutter create build_project

          cp -r build_project/android/* android/
          cp -r build_project/ios/* ios/ 2>/dev/null || true
          cp -r build_project/web/* web/ 2>/dev/null || true
          cp -r build_project/linux/* linux/ 2>/dev/null || true
          cp -r build_project/macos/* macos/ 2>/dev/null || true
          cp -r build_project/windows/* windows/ 2>/dev/null || true

      - name: Copy Firebase configuration
        run: |
          mkdir -p android/app
          cp android/app/google-services.json build_project/android/app/google-services.json 2>/dev/null || true

      - name: Restore Firebase configuration
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json found"
          else
            echo "google-services.json not found"
          fi

      - name: Copy app code
        run: |
          mkdir -p lib
          if [ -f lib/main.dart ]; then
            echo "Using existing lib/main.dart"
          else
            cp build_project/lib/main.dart lib/main.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewasaFoodHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
