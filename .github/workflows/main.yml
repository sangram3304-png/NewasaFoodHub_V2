name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Check Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found"
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Backup Firebase configuration
        run: |
          cp android/app/google-services.json /tmp/google-services.json

      - name: Create Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name=newasafoodhub_v2 \
            .

      - name: Restore Firebase configuration
        run: |
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json

          echo "Firebase configuration restored."

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_gradle = Path("android/app/build.gradle")
          text = app_gradle.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id 'com.google.gms.google-services'"""
              )

          app_gradle.write_text(text)

          root_gradle = Path("android/build.gradle")
          text = root_gradle.read_text()

          if "com.google.gms:google-services" not in text:
              text = """buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }

          """ + text

          root_gradle.write_text(text)
          PY

      - name: Set Android minSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text = re.sub(
              r'(?m)^\s*minSdkVersion\s+.*$',
              '        minSdkVersion 23',
              text
          )

          text = re.sub(
              r'(?m)^\s*minSdk\s*=\s*.*$',
              '        minSdk = 23',
              text
          )

          p.write_text(text)
          PY

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewasaFoodHub-APK-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
