name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.newasafoodhub --project-name newasafoodhub_v2 .

      - name: Set Firebase package name
        run: |
          sed -i 's/applicationId = "com.example.newasafoodhub_v2"/applicationId = "com.newasafoodhub.app"/g' android/app/build.gradle
          sed -i 's/applicationId "com.example.newasafoodhub_v2"/applicationId "com.newasafoodhub.app"/g' android/app/build.gradle
          sed -i 's/applicationId = "com.newasafoodhub.newasa_food_hub"/applicationId = "com.newasafoodhub.app"/g' android/app/build.gradle
          sed -i 's/applicationId "com.newasafoodhub.newasa_food_hub"/applicationId "com.newasafoodhub.app"/g' android/app/build.gradle

      - name: Set minimum SDK to 23
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion 21/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion = 21/minSdkVersion = 23/g' android/app/build.gradle

      - name: Verify configuration
        run: |
          echo "========== BUILD.GRADLE =========="
          cat android/app/build.gradle

          echo "========== FIREBASE PACKAGE =========="
          grep -n "package_name" android/app/google-services.json

          echo "========== APPLICATION ID =========="
          grep -n "applicationId" android/app/build.gradle

          echo "========== MIN SDK =========="
          grep -n "minSdk" android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewasaFoodHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
